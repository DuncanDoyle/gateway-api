apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query-method-matching
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - method: QUERY
    backendRefs:
    - name: infra-backend-v1
      port: 8080
  - matches:
    - method: POST
    backendRefs:
    - name: infra-backend-v2
      port: 8080

  # Combination with a path match.
  - matches:
    - path:
        type: PathPrefix
        value: /path1
      method: QUERY
    backendRefs:
    - name: infra-backend-v3
      port: 8080
